name: Integration
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Run integration tests
        run: npm run test:integration
  test:
    runs-on: ubuntu-latest
    steps:
      - after: build
      - name: Run unit tests
        run: npm test